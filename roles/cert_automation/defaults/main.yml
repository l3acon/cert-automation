---
# --- Project identity ---
cert_aap_org: Default
cert_aap_project_name: "Certificate Automation"
cert_aap_project_scm_url: "https://github.com/l3acon/cert-automation.git"
cert_aap_project_scm_branch: main

# --- SCM credential (GitHub PAT for private repo) ---
cert_github_pat: ""
cert_scm_credential_name: "GitHub PAT - Certificate Automation"

# --- Execution Environment ---
# Cloud Services EE has community.crypto + amazon.aws for cert operations
cert_aap_ee_name: "Cloud Services Execution Environment"
cert_aap_ee_image: "quay.io/scottharwell/cloud-ee:latest"

# --- ACME / Let's Encrypt ---
cert_acme_env: staging
cert_account_email: "matferna@redhat.com"

# --- Domain / Route53 ---
cert_route53_zone: ""
cert_hostname: ""

# --- Certificate paths (on the bastion / localhost running the job) ---
cert_base_path: "/tmp/certs/{{ cert_acme_env }}"
cert_privatekey_path: "{{ cert_base_path }}/{{ cert_hostname }}.pem"
cert_fullchain_path: "{{ cert_base_path }}/fullchain.crt"
cert_chain_path: "{{ cert_base_path }}/intermediate.crt"
cert_account_key_path: "{{ cert_base_path }}/letsencrypt-{{ cert_acme_env }}.pem"
cert_csr_path: "{{ cert_base_path }}/{{ cert_hostname }}.csr"
cert_crt_path: "{{ cert_base_path }}/{{ cert_hostname }}.crt"

# --- AAP credential names (referenced by templates) ---
cert_aws_credential_name: "AWS"
cert_machine_credential_name: "APD Machine Credential"

# --- APD Inventory (reuse the existing EC2 inventory) ---
cert_inventory_name: "Ansible Product Demos Inventory"
