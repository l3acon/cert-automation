---
# --- Project identity ---
cert_aap_org: Default
cert_aap_project_name: "Certificate Automation"
cert_aap_project_scm_url: "https://github.com/l3acon/cert-automation.git"
cert_aap_project_scm_branch: main

# --- SCM credential (GitHub PAT for private repo) ---
cert_github_pat: ""
cert_scm_credential_name: "GitHub PAT - Certificate Automation"

# --- Execution Environment ---
cert_aap_ee_name: "Default execution environment"

# --- ACME / Let's Encrypt ---
cert_acme_env: staging
cert_account_email: "matferna@redhat.com"

# --- AWS ---
cert_aws_region: us-east-2

# --- Domain / Route53 ---
cert_route53_zone: ""
cert_ansible_hostname: ""
cert_cleanup_dns_record: false

# --- Certificate paths (defaults for distribute targets) ---
cert_dest_path: "/etc/pki/tls/certs/fullchain.crt"
cert_key_dest_path: "/etc/pki/tls/private/server.key"

# --- AAP credential names ---
cert_aws_credential_name: "AWS"
cert_machine_credential_name: "APD Machine Credential"
cert_aap_credential_name: "AAP Credential"
cert_tls_credential_type_name: "TLS Certificate"
cert_ephemeral_credential_name: "TLS Cert - {{ cert_hostname | default('pending') }}"

# --- APD Inventory ---
cert_inventory_name: "Ansible Product Demos Inventory"
