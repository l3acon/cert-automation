---
# =============================================================================
# AAP Config as Code — controller_* variables
# Consumed by infra.aap_configuration.dispatch
# =============================================================================

# --- Custom Credential Type: TLS Certificate ---
# Created directly in tasks/main.yml (dispatch has issues with !unsafe injectors).
# Defined here for reference only.

# --- SCM Credential ---
controller_credentials:
  - name: "{{ cert_scm_credential_name }}"
    organization: "{{ cert_aap_org }}"
    credential_type: "Source Control"
    inputs:
      username: "git"
      password: "{{ cert_github_pat }}"

# --- Projects ---
controller_projects:
  - name: "{{ cert_aap_project_name }}"
    organization: "{{ cert_aap_org }}"
    scm_type: git
    scm_url: "{{ cert_aap_project_scm_url }}"
    scm_branch: "{{ cert_aap_project_scm_branch }}"
    scm_update_on_launch: true
    credential: "{{ cert_scm_credential_name }}"
    wait: true

# --- Inventories ---
controller_inventories:
  - name: "Cert Automation - Localhost"
    organization: "{{ cert_aap_org }}"
    description: "Runtime inventory for certificate operations (localhost)"

controller_hosts:
  - name: localhost
    inventory: "Cert Automation - Localhost"
    variables:
      ansible_connection: local
      ansible_python_interpreter: "{{ '{{ ansible_playbook_python }}' }}"

# --- Job Templates ---
controller_templates:
  - name: "Cert - Issue Certificate"
    organization: "{{ cert_aap_org }}"
    project: "{{ cert_aap_project_name }}"
    inventory: "Cert Automation - Localhost"
    playbook: playbooks/certs/issue_cert.yml
    execution_environment: "{{ cert_aap_ee_name }}"
    credentials:
      - "{{ cert_aws_credential_name }}"
      - "{{ cert_aap_credential_name }}"
    extra_vars:
      aap_request_timeout: 10
    survey_enabled: true
    survey_spec:
      name: "Certificate Parameters"
      description: "Issue a certificate and distribute to target hosts"
      spec:
        - question_name: "Hostname (FQDN)"
          variable: cert_hostname
          type: text
          required: true
        - question_name: "Route53 Zone"
          variable: cert_route53_zone
          type: text
          required: true
          default: "{{ cert_route53_zone }}"
        - question_name: "ACME Environment"
          variable: cert_acme_env
          type: multiplechoice
          required: true
          default: "{{ cert_acme_env }}"
          choices:
            - staging
            - production
        - question_name: "Account Email"
          variable: cert_account_email
          type: text
          required: true
          default: "{{ cert_account_email }}"
        - question_name: "Target hosts (comma-separated IPs)"
          question_description: "Hosts to receive the certificate after issuance"
          variable: cert_target_hosts
          type: text
          required: true
        - question_name: "Certificate destination path"
          variable: cert_dest_path
          type: text
          required: true
          default: "{{ cert_dest_path }}"
        - question_name: "Private key destination path"
          variable: cert_key_dest_path
          type: text
          required: true
          default: "{{ cert_key_dest_path }}"

  - name: "Cert - Distribute Certificate"
    organization: "{{ cert_aap_org }}"
    project: "{{ cert_aap_project_name }}"
    inventory: "Cert Automation - Localhost"
    playbook: playbooks/certs/distribute_cert.yml
    execution_environment: "{{ cert_aap_ee_name }}"
    credentials:
      - "{{ cert_machine_credential_name }}"
    survey_enabled: true
    survey_spec:
      name: "Distribution Parameters"
      description: "Distribute a certificate to target hosts (cert comes from TLS credential)"
      spec:
        - question_name: "Target hosts (comma-separated IPs)"
          variable: cert_target_hosts
          type: text
          required: true
        - question_name: "Certificate destination path"
          variable: cert_dest_path
          type: text
          required: true
          default: "{{ cert_dest_path }}"
        - question_name: "Private key destination path"
          variable: cert_key_dest_path
          type: text
          required: true
          default: "{{ cert_key_dest_path }}"

# --- Workflow: Staging to Production ---
controller_workflows:
  - name: "Cert - Staging to Production"
    organization: "{{ cert_aap_org }}"
    description: "Issue and distribute a certificate in staging, then repeat in production on success"
    survey_enabled: true
    survey_spec:
      name: "Staging to Production Parameters"
      description: "Certificate parameters for staged rollout"
      spec:
        - question_name: "Hostname (FQDN)"
          variable: cert_hostname
          type: text
          required: true
        - question_name: "Route53 Zone"
          variable: cert_route53_zone
          type: text
          required: true
          default: "{{ cert_route53_zone }}"
        - question_name: "Account Email"
          variable: cert_account_email
          type: text
          required: true
          default: "{{ cert_account_email }}"
        - question_name: "Target hosts (comma-separated IPs)"
          variable: cert_target_hosts
          type: text
          required: true
        - question_name: "Certificate destination path"
          variable: cert_dest_path
          type: text
          required: true
          default: "{{ cert_dest_path }}"
        - question_name: "Private key destination path"
          variable: cert_key_dest_path
          type: text
          required: true
          default: "{{ cert_key_dest_path }}"
    simplified_workflow_nodes:
      - identifier: staging
        unified_job_template: "Cert - Issue Certificate"
        extra_data:
          cert_acme_env: staging
        success_nodes:
          - production
      - identifier: production
        unified_job_template: "Cert - Issue Certificate"
        extra_data:
          cert_acme_env: production
