---
# =============================================================================
# AAP Config as Code — controller_* variables
# Consumed by infra.aap_configuration.dispatch
#
# Credentials flow through AWS Secrets Manager:
#   - SM Lookup credential (secret zero, stored in AAP) authenticates to SM
#   - Machine credential pulls SSH key from SM via credential input source
#   - TLS certs are written/read directly to/from SM by playbooks
# =============================================================================

# --- Credentials ---
controller_credentials:
  - name: "{{ cert_scm_credential_name }}"
    organization: "{{ cert_aap_org }}"
    credential_type: "Source Control"
    inputs:
      username: "git"
      password: "{{ cert_github_pat }}"

  # Secret zero: stored directly in AAP, provides access to Secrets Manager
  - name: "{{ cert_sm_lookup_credential_name }}"
    organization: "{{ cert_aap_org }}"
    credential_type: "AWS Secrets Manager lookup"
    inputs:
      aws_access_key: "{{ aws_access_key_id }}"
      aws_secret_key: "{{ aws_secret_access_key }}"

  # Machine credential — fields pulled from SM at job launch time
  - name: "{{ cert_machine_credential_name }}"
    organization: "{{ cert_aap_org }}"
    credential_type: Machine
    inputs:
      username: ec2-user

# --- Credential Input Sources (SM → AAP credentials) ---
# AAP pulls the full secret value from SM and injects it into the credential field.
# The SM secret must contain the raw value (e.g., raw SSH private key text).
controller_credential_input_sources:
  - source_credential: "{{ cert_sm_lookup_credential_name }}"
    target_credential: "{{ cert_machine_credential_name }}"
    input_field_name: ssh_key_data
    metadata:
      region_name: "{{ cert_aws_region }}"
      secret_name: "{{ cert_sm_secret_prefix }}/machine-credential/ssh_key_data"

# --- Projects ---
controller_projects:
  - name: "{{ cert_aap_project_name }}"
    organization: "{{ cert_aap_org }}"
    scm_type: git
    scm_url: "{{ cert_aap_project_scm_url }}"
    scm_branch: "{{ cert_aap_project_scm_branch }}"
    scm_update_on_launch: true
    credential: "{{ cert_scm_credential_name }}"
    wait: true

# --- Inventories ---
controller_inventories:
  - name: "Cert Automation - Localhost"
    organization: "{{ cert_aap_org }}"
    description: "Runtime inventory for certificate operations (localhost)"

controller_hosts:
  - name: localhost
    inventory: "Cert Automation - Localhost"
    variables:
      ansible_connection: local
      ansible_python_interpreter: "{{ '{{ ansible_playbook_python }}' }}"

# --- Job Templates ---
controller_templates:
  - name: "Cert - Issue Certificate"
    organization: "{{ cert_aap_org }}"
    project: "{{ cert_aap_project_name }}"
    inventory: "Cert Automation - Localhost"
    playbook: playbooks/certs/issue_cert.yml
    execution_environment: "{{ cert_aap_ee_name }}"
    credentials:
      - "{{ cert_aws_credential_name }}"
      - "{{ cert_aap_credential_name }}"
    extra_vars:
      aap_request_timeout: 10
    survey_enabled: true
    survey_spec:
      name: "Certificate Parameters"
      description: "Issue a certificate and distribute to target hosts"
      spec:
        - question_name: "Ansible Hostname"
          question_description: "EC2 Name tag of the target host (e.g. aws_rhel9)"
          variable: cert_ansible_hostname
          type: text
          required: true
        - question_name: "AWS Region"
          variable: cert_aws_region
          type: text
          required: true
          default: "{{ cert_aws_region }}"
        - question_name: "Route53 Zone"
          variable: cert_route53_zone
          type: text
          required: true
          default: "{{ cert_route53_zone }}"
        - question_name: "ACME Environment"
          variable: cert_acme_env
          type: multiplechoice
          required: true
          default: "{{ cert_acme_env }}"
          choices:
            - staging
            - production
        - question_name: "Account Email"
          variable: cert_account_email
          type: text
          required: true
          default: "{{ cert_account_email }}"
        - question_name: "Certificate destination path"
          variable: cert_dest_path
          type: text
          required: true
          default: "{{ cert_dest_path }}"
        - question_name: "Private key destination path"
          variable: cert_key_dest_path
          type: text
          required: true
          default: "{{ cert_key_dest_path }}"
        - question_name: "Clean up DNS TXT record after validation?"
          question_description: "Set to false to preserve the record for auditability"
          variable: cert_cleanup_dns_record
          type: multiplechoice
          required: true
          default: "false"
          choices:
            - "false"
            - "true"

  - name: "Cert - Distribute Certificate"
    organization: "{{ cert_aap_org }}"
    project: "{{ cert_aap_project_name }}"
    inventory: "Cert Automation - Localhost"
    playbook: playbooks/certs/distribute_cert.yml
    execution_environment: "{{ cert_aap_ee_name }}"
    credentials:
      - "{{ cert_aws_credential_name }}"
      - "{{ cert_machine_credential_name }}"
    ask_variables_on_launch: true
    extra_vars:
      cert_aws_region: "{{ cert_aws_region }}"
      cert_dest_path: "{{ cert_dest_path }}"
      cert_key_dest_path: "{{ cert_key_dest_path }}"
    survey_enabled: true
    survey_spec:
      name: "Distribution Parameters"
      description: "Distribute a certificate from Secrets Manager to target hosts"
      spec:
        - question_name: "Target hosts (comma-separated IPs or hostnames)"
          question_description: "Resolved automatically via set_stats from the Issue JT"
          variable: cert_target_hosts
          type: text
          required: true
        - question_name: "Secrets Manager secret name"
          question_description: "SM path containing the cert (set automatically via set_stats from Issue JT)"
          variable: cert_sm_secret_name
          type: text
          required: true

  - name: "Cert - Notify Failure"
    organization: "{{ cert_aap_org }}"
    project: "{{ cert_aap_project_name }}"
    inventory: "Cert Automation - Localhost"
    playbook: playbooks/certs/notify_failure.yml
    execution_environment: "{{ cert_aap_ee_name }}"
    ask_variables_on_launch: true
    survey_enabled: false

# --- Workflows ---
controller_workflows:
  # Two-node workflow: Issue → Distribute (single environment)
  - name: "Cert - Issue and Distribute"
    organization: "{{ cert_aap_org }}"
    description: >-
      Issue a certificate via Let's Encrypt (DNS-01 / Route53), store in Secrets Manager,
      then distribute to the target host. On failure, send a notification.
    survey_enabled: true
    destroy_current_nodes: true
    survey_spec:
      name: "Issue and Distribute Parameters"
      description: "End-to-end certificate issuance and distribution"
      spec:
        - question_name: "Ansible Hostname"
          question_description: "EC2 Name tag of the target host (e.g. aws_rhel9)"
          variable: cert_ansible_hostname
          type: text
          required: true
        - question_name: "Route53 Zone"
          variable: cert_route53_zone
          type: text
          required: true
          default: "{{ cert_route53_zone }}"
        - question_name: "ACME Environment"
          variable: cert_acme_env
          type: multiplechoice
          required: true
          default: "{{ cert_acme_env }}"
          choices:
            - staging
            - production
        - question_name: "Account Email"
          variable: cert_account_email
          type: text
          required: true
          default: "{{ cert_account_email }}"
        - question_name: "Clean up DNS TXT record?"
          variable: cert_cleanup_dns_record
          type: multiplechoice
          required: true
          default: "false"
          choices:
            - "false"
            - "true"
    simplified_workflow_nodes:
      - identifier: issue
        unified_job_template: "Cert - Issue Certificate"
        success_nodes:
          - distribute
        failure_nodes:
          - notify-issue-failed
      - identifier: distribute
        unified_job_template: "Cert - Distribute Certificate"
        failure_nodes:
          - notify-distribute-failed
      - identifier: notify-issue-failed
        unified_job_template: "Cert - Notify Failure"
        extra_data:
          cert_notify_stage: "Issue Certificate"
      - identifier: notify-distribute-failed
        unified_job_template: "Cert - Notify Failure"
        extra_data:
          cert_notify_stage: "Distribute Certificate"

  # Four-node workflow: Staging (issue → distribute) → Production (issue → distribute)
  - name: "Cert - Staging to Production"
    organization: "{{ cert_aap_org }}"
    description: >-
      Full staged rollout: issue and distribute a staging (test) certificate first,
      then on success repeat with a production (trusted) certificate. Each step has
      a failure notification path.
    survey_enabled: true
    destroy_current_nodes: true
    survey_spec:
      name: "Staging to Production Parameters"
      description: "Certificate parameters for staged rollout"
      spec:
        - question_name: "Ansible Hostname"
          question_description: "EC2 Name tag of the target host (e.g. aws_rhel9)"
          variable: cert_ansible_hostname
          type: text
          required: true
        - question_name: "Route53 Zone"
          variable: cert_route53_zone
          type: text
          required: true
          default: "{{ cert_route53_zone }}"
        - question_name: "Account Email"
          variable: cert_account_email
          type: text
          required: true
          default: "{{ cert_account_email }}"
        - question_name: "Clean up DNS TXT record?"
          variable: cert_cleanup_dns_record
          type: multiplechoice
          required: true
          default: "false"
          choices:
            - "false"
            - "true"
    simplified_workflow_nodes:
      # ── Staging ────────────────────────────────────────────────
      - identifier: staging-issue
        unified_job_template: "Cert - Issue Certificate"
        extra_data:
          cert_acme_env: staging
        success_nodes:
          - staging-distribute
        failure_nodes:
          - notify-staging-issue-failed
      - identifier: staging-distribute
        unified_job_template: "Cert - Distribute Certificate"
        extra_data:
          cert_acme_env: staging
        success_nodes:
          - production-issue
        failure_nodes:
          - notify-staging-distribute-failed
      # ── Production ────────────────────────────────────────────
      - identifier: production-issue
        unified_job_template: "Cert - Issue Certificate"
        extra_data:
          cert_acme_env: production
        success_nodes:
          - production-distribute
        failure_nodes:
          - notify-production-issue-failed
      - identifier: production-distribute
        unified_job_template: "Cert - Distribute Certificate"
        extra_data:
          cert_acme_env: production
        failure_nodes:
          - notify-production-distribute-failed
      # ── Failure notifications ─────────────────────────────────
      - identifier: notify-staging-issue-failed
        unified_job_template: "Cert - Notify Failure"
        extra_data:
          cert_notify_stage: "Staging - Issue Certificate"
      - identifier: notify-staging-distribute-failed
        unified_job_template: "Cert - Notify Failure"
        extra_data:
          cert_notify_stage: "Staging - Distribute Certificate"
      - identifier: notify-production-issue-failed
        unified_job_template: "Cert - Notify Failure"
        extra_data:
          cert_notify_stage: "Production - Issue Certificate"
      - identifier: notify-production-distribute-failed
        unified_job_template: "Cert - Notify Failure"
        extra_data:
          cert_notify_stage: "Production - Distribute Certificate"
