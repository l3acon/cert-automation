---
# Deploy Certificate Automation CasC to AAP.
# Resolves Route53 zone and AWS creds from rosa.creds.yml automatically.
#
# Usage:
#   source .env && ansible-playbook deploy_certs.yml
- name: Deploy Certificate Automation to AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_hostname: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    aap_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    aap_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    cert_github_pat: "{{ lookup('env', 'GITHUB_PAT') }}"
    rosa_creds_path: "{{ playbook_dir }}/../mad-hatter/rosa.creds.yml"
    _rosa_provision_data: >-
      {{ (lookup('file', rosa_creds_path) | from_yaml_all | list)[0]
         .status.resources[0].state.spec.vars.provision_data }}
    cert_route53_zone: "{{ _rosa_provision_data.rosa_subdomain_base }}"
    cert_aws_region: "{{ _rosa_provision_data.aws_default_region | default('us-east-2') }}"
    aws_access_key_id: "{{ _rosa_provision_data.aws_access_key_id }}"
    aws_secret_access_key: "{{ _rosa_provision_data.aws_secret_access_key }}"
    cert_sm_secret_prefix: "cert-automation"

  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ cert_aws_region }}"

  tasks:
    - name: Validate credentials
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_username | length > 0
          - aap_password | length > 0
          - cert_github_pat | length > 0
          - cert_route53_zone | length > 0
          - aws_access_key_id | length > 0
          - aws_secret_access_key | length > 0
        fail_msg: >-
          Missing credentials. Set CONTROLLER_HOST, CONTROLLER_USERNAME,
          CONTROLLER_PASSWORD, GITHUB_PAT, and ensure rosa.creds.yml is accessible.

    - name: Display resolved configuration
      ansible.builtin.debug:
        msg:
          - "AAP: {{ aap_hostname }}"
          - "Route53 zone: {{ cert_route53_zone }}"
          - "AWS region: {{ cert_aws_region }}"

    # ── Bootstrap: seed machine credential SSH key into Secrets Manager ──
    # AAP SM lookup returns the full secret value, so each field gets its own secret.
    - name: Resolve SSH private key for machine credential
      ansible.builtin.set_fact:
        _machine_ssh_key: >-
          {{ lookup('env', 'MACHINE_SSH_KEY')
             | default(lookup('file', '~/.ssh/id_rsa', errors='ignore')
             | default('', true), true) }}

    - name: Store machine credential SSH key in Secrets Manager
      community.aws.secretsmanager_secret:
        name: "{{ cert_sm_secret_prefix }}/machine-credential/ssh_key_data"
        state: present
        secret_type: string
        secret: "{{ _machine_ssh_key }}"
        tags:
          managed_by: cert-automation
          purpose: machine-credential-ssh-key
      when: _machine_ssh_key | length > 0

    - name: Warn if no SSH key was found
      ansible.builtin.debug:
        msg: >-
          ⚠️  No SSH key found. Seed it manually:
            aws secretsmanager put-secret-value
              --secret-id {{ cert_sm_secret_prefix }}/machine-credential/ssh_key_data
              --secret-string "$(cat ~/.ssh/your_key)"
      when: _machine_ssh_key | length == 0

    # ── Deploy CaC to AAP ───────────────────────────────────────────────
    - name: Configure AAP via CasC
      ansible.builtin.include_role:
        name: cert_automation
      vars:
        controller_host: "{{ aap_hostname }}"
        controller_username: "{{ aap_username }}"
        controller_password: "{{ aap_password }}"
        validate_certs: false
