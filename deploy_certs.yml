---
# Deploy Certificate Automation CasC to AAP.
#
# AWS credentials and Route53 zone can be provided via:
#   1. Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, CERT_ROUTE53_ZONE)
#   2. ROSA/RHDP rosa.creds.yml (auto-parsed if present)
#   3. Extra vars on the command line
#
# Usage:
#   source .env && ansible-playbook deploy_certs.yml
- name: Deploy Certificate Automation to AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # --- AAP connection ---
    aap_hostname: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    aap_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    aap_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    cert_github_pat: "{{ lookup('env', 'GITHUB_PAT') }}"

    # --- AWS credential resolution (env vars > rosa.creds.yml > extra vars) ---
    rosa_creds_path: "{{ playbook_dir }}/../mad-hatter/rosa.creds.yml"
    _rosa_available: "{{ lookup('file', rosa_creds_path, errors='ignore') | default('', true) | length > 0 }}"
    _rosa_provision_data: >-
      {{ (lookup('file', rosa_creds_path, errors='ignore') | default('', true) | from_yaml_all | list)[0]
         .status.resources[0].state.spec.vars.provision_data
         if _rosa_available | bool else {} }}

    aws_access_key_id: >-
      {{ lookup('env', 'AWS_ACCESS_KEY_ID')
         | default(_rosa_provision_data.aws_access_key_id | default(''), true) }}
    aws_secret_access_key: >-
      {{ lookup('env', 'AWS_SECRET_ACCESS_KEY')
         | default(_rosa_provision_data.aws_secret_access_key | default(''), true) }}
    cert_aws_region: >-
      {{ lookup('env', 'AWS_DEFAULT_REGION')
         | default(_rosa_provision_data.aws_default_region | default('us-east-2'), true) }}
    cert_route53_zone: >-
      {{ lookup('env', 'CERT_ROUTE53_ZONE')
         | default(_rosa_provision_data.rosa_subdomain_base | default(''), true) }}
    cert_sm_secret_prefix: "cert-automation"

  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ cert_aws_region }}"

  tasks:
    - name: Validate AAP credentials
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_username | length > 0
          - aap_password | length > 0
          - cert_github_pat | length > 0
        fail_msg: >-
          Missing AAP credentials. Ensure .env has CONTROLLER_HOST,
          CONTROLLER_USERNAME, CONTROLLER_PASSWORD, and GITHUB_PAT.

    - name: Validate AWS credentials
      ansible.builtin.assert:
        that:
          - aws_access_key_id | length > 0
          - aws_secret_access_key | length > 0
          - cert_route53_zone | length > 0
        fail_msg: >-
          Missing AWS credentials or Route53 zone. Provide them via environment
          variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, CERT_ROUTE53_ZONE)
          or ensure rosa.creds.yml is accessible at {{ rosa_creds_path }}.

    - name: Display resolved configuration
      ansible.builtin.debug:
        msg:
          - "AAP:          {{ aap_hostname }}"
          - "Route53 zone: {{ cert_route53_zone }}"
          - "AWS region:   {{ cert_aws_region }}"
          - "AWS source:   {{ 'rosa.creds.yml' if _rosa_available | bool else 'environment variables' }}"

    # ── Bootstrap: seed machine credential SSH key into Secrets Manager ──
    - name: Resolve SSH private key for machine credential
      ansible.builtin.set_fact:
        _machine_ssh_key: >-
          {{ lookup('env', 'MACHINE_SSH_KEY')
             | default(lookup('file', '~/.ssh/id_rsa', errors='ignore')
             | default(lookup('file', '~/.ssh/id_ed25519', errors='ignore')
             | default('', true), true), true) }}

    - name: Store machine credential SSH key in Secrets Manager
      community.aws.secretsmanager_secret:
        name: "{{ cert_sm_secret_prefix }}/machine-credential/ssh_key_data"
        state: present
        secret_type: string
        secret: "{{ _machine_ssh_key }}"
        tags:
          managed_by: cert-automation
          purpose: machine-credential-ssh-key
      when: _machine_ssh_key | length > 0

    - name: Warn if no SSH key was found
      ansible.builtin.debug:
        msg: >-
          ⚠️  No SSH key found. Seed it manually:
            aws secretsmanager put-secret-value
              --secret-id {{ cert_sm_secret_prefix }}/machine-credential/ssh_key_data
              --secret-string "$(cat ~/.ssh/your_key)"
      when: _machine_ssh_key | length == 0

    # ── Deploy CaC to AAP ───────────────────────────────────────────────
    - name: Configure AAP via CasC
      ansible.builtin.include_role:
        name: cert_automation
      vars:
        controller_host: "{{ aap_hostname }}"
        controller_username: "{{ aap_username }}"
        controller_password: "{{ aap_password }}"
        validate_certs: false
