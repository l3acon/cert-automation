---
# Issue a certificate via ACME DNS-01 with Route53, then orchestrate distribution.
#
# After issuing, this playbook:
#   1. Creates an ephemeral TLS Certificate credential with the cert+key
#   2. Updates the Distribute JT to attach the credential
#   3. Launches the Distribute JT
#   4. Waits for completion
#   5. Deletes the ephemeral credential
#
# Requires: AWS credential (Route53), AAP Credential (controller API for dispatch)
- name: Issue certificate via ACME DNS-01 challenge with Route53
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    acme_directory: >-
      {{ (cert_acme_env == 'production')
         | ternary('https://acme-v02.api.letsencrypt.org/directory',
                   'https://acme-staging-v02.api.letsencrypt.org/directory') }}
    acme_version: 2
    cert_base_path: "/tmp/certs/{{ cert_acme_env }}"
    privatekey_path: "{{ cert_base_path }}/{{ cert_hostname }}.pem"
    fullchain_path: "{{ cert_base_path }}/fullchain.crt"
    chain_path: "{{ cert_base_path }}/intermediate.crt"
    account_key_path: "{{ cert_base_path }}/letsencrypt-{{ cert_acme_env }}.pem"
    csr_path: "{{ cert_base_path }}/{{ cert_hostname }}.csr"
    crt_path: "{{ cert_base_path }}/{{ cert_hostname }}.crt"
    _ephemeral_cred_name: "TLS Cert - {{ cert_hostname }} ({{ cert_acme_env }})"
    _distribute_jt_name: "Cert - Distribute Certificate"

  tasks:
    # ── Issue the certificate ────────────────────────────────────────────
    - name: Ensure certificate directory exists
      ansible.builtin.file:
        path: "{{ cert_base_path }}"
        state: directory
        mode: "0700"

    - name: Generate ACME account private key
      community.crypto.openssl_privatekey:
        path: "{{ account_key_path }}"

    - name: Generate server private key
      community.crypto.openssl_privatekey:
        path: "{{ privatekey_path }}"

    - name: Generate Certificate Signing Request
      community.crypto.openssl_csr:
        path: "{{ csr_path }}"
        privatekey_path: "{{ privatekey_path }}"
        common_name: "{{ cert_hostname }}"

    - name: Request ACME challenge
      community.crypto.acme_certificate:
        terms_agreed: true
        acme_version: "{{ acme_version }}"
        account_key_src: "{{ account_key_path }}"
        account_email: "{{ cert_account_email }}"
        src: "{{ csr_path }}"
        cert: "{{ crt_path }}"
        challenge: dns-01
        acme_directory: "{{ acme_directory }}"
        remaining_days: 30
      register: acme_challenge

    - name: Create Route53 DNS-01 TXT record
      amazon.aws.route53:
        zone: "{{ cert_route53_zone }}"
        record: "{{ acme_challenge.challenge_data[cert_hostname]['dns-01'].record }}"
        type: TXT
        ttl: 60
        state: present
        wait: true
        overwrite: true
        value: >-
          "{{ acme_challenge.challenge_data[cert_hostname]['dns-01'].resource_value }}"
      when:
        - acme_challenge is changed
        - cert_hostname in acme_challenge.challenge_data

    - name: Validate challenge and retrieve certificate
      community.crypto.acme_certificate:
        terms_agreed: true
        acme_version: "{{ acme_version }}"
        account_key_src: "{{ account_key_path }}"
        account_email: "{{ cert_account_email }}"
        src: "{{ csr_path }}"
        cert: "{{ crt_path }}"
        fullchain: "{{ fullchain_path }}"
        chain: "{{ chain_path }}"
        challenge: dns-01
        acme_directory: "{{ acme_directory }}"
        remaining_days: 30
        data: "{{ acme_challenge }}"
      when: acme_challenge is changed

    - name: Clean up Route53 TXT record
      amazon.aws.route53:
        zone: "{{ cert_route53_zone }}"
        record: "{{ acme_challenge.challenge_data[cert_hostname]['dns-01'].record }}"
        type: TXT
        ttl: 60
        state: absent
        value: >-
          "{{ acme_challenge.challenge_data[cert_hostname]['dns-01'].resource_value }}"
      when:
        - acme_challenge is changed
        - cert_hostname in acme_challenge.challenge_data

    - name: Display certificate paths
      ansible.builtin.debug:
        msg:
          - "Certificate:  {{ crt_path }}"
          - "Full chain:   {{ fullchain_path }}"
          - "Private key:  {{ privatekey_path }}"
          - "Chain:        {{ chain_path }}"

    # ── Read cert content for credential creation ────────────────────────
    - name: Read issued certificate and key
      ansible.builtin.set_fact:
        _cert_fullchain: "{{ lookup('file', fullchain_path) }}"
        _cert_privatekey: "{{ lookup('file', privatekey_path) }}"

    # ── Orchestrate distribution via dispatch ────────────────────────────
    - name: Create ephemeral TLS credential with issued cert
      ansible.controller.credential:
        name: "{{ _ephemeral_cred_name }}"
        organization: Default
        credential_type: "TLS Certificate"
        state: present
        inputs:
          cert_fullchain: "{{ _cert_fullchain }}"
          cert_private_key: "{{ _cert_privatekey }}"
        controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
        controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        validate_certs: false
        request_timeout: 10
      register: _cred_created

    - name: Look up Distribute JT
      ansible.builtin.uri:
        url: "{{ lookup('env', 'CONTROLLER_HOST') | regex_replace('/$', '') }}/api/controller/v2/job_templates/?name={{ _distribute_jt_name | urlencode }}"
        method: GET
        url_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        url_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: _dist_jt_lookup

    - name: Set distribute JT ID
      ansible.builtin.set_fact:
        _dist_jt_id: "{{ _dist_jt_lookup.json.results[0].id }}"

    - name: Attach ephemeral TLS credential to Distribute JT
      ansible.builtin.uri:
        url: "{{ lookup('env', 'CONTROLLER_HOST') | regex_replace('/$', '') }}/api/controller/v2/job_templates/{{ _dist_jt_id }}/credentials/"
        method: POST
        url_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        url_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: "{{ {'id': _cred_created.id | int} }}"
        status_code: [200, 204]

    - name: Launch Distribute JT
      ansible.controller.job_launch:
        job_template: "{{ _distribute_jt_name }}"
        extra_vars:
          cert_target_hosts: "{{ cert_target_hosts }}"
          cert_dest_path: "{{ cert_dest_path }}"
          cert_key_dest_path: "{{ cert_key_dest_path }}"
        wait: true
        timeout: 600
        controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
        controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        validate_certs: false
        request_timeout: 10
      register: _dist_job

    - name: Display distribution result
      ansible.builtin.debug:
        msg:
          - "Distribution job: {{ _dist_job.id | default('?') }}"
          - "Status: {{ _dist_job.status | default('?') }}"

    # ── Cleanup: remove ephemeral credential ─────────────────────────────
    - name: Detach ephemeral TLS credential from Distribute JT
      ansible.builtin.uri:
        url: "{{ lookup('env', 'CONTROLLER_HOST') | regex_replace('/$', '') }}/api/controller/v2/job_templates/{{ _dist_jt_id }}/credentials/"
        method: POST
        url_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        url_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: "{{ {'id': _cred_created.id | int, 'disassociate': true} }}"
        status_code: [200, 204]

    - name: Delete ephemeral TLS credential
      ansible.controller.credential:
        name: "{{ _ephemeral_cred_name }}"
        organization: Default
        credential_type: "TLS Certificate"
        state: absent
        controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
        controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        validate_certs: false
        request_timeout: 10

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════"
          - "Certificate issued and distributed successfully"
          - "═══════════════════════════════════════════════"
          - "Hostname: {{ cert_hostname }}"
          - "ACME env: {{ cert_acme_env }}"
          - "Targets:  {{ cert_target_hosts }}"
          - "Cert:     {{ cert_dest_path }}"
          - "Key:      {{ cert_key_dest_path }}"
          - "Ephemeral credential cleaned up"
          - "═══════════════════════════════════════════════"
