---
# Issue a certificate via ACME DNS-01 with Route53, store in AWS Secrets Manager,
# then launch the Distribute JT to deploy it to target hosts.
#
# Flow:
#   1. Look up EC2 instance by Name tag → resolve FQDN + IP
#   2. Ensure A record exists in Route53
#   3. Issue cert via ACME DNS-01 challenge
#   4. Store cert + key in AWS Secrets Manager
#   5. Launch Distribute JT (reads cert from SM)
#
# Requires: AWS credential (Route53 + EC2 + SM), AAP Credential (job_launch)
- name: Issue certificate via ACME DNS-01 challenge with Route53
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    AWS_DEFAULT_REGION: "{{ cert_aws_region | default('us-east-2') }}"

  vars:
    acme_directory: >-
      {{ (cert_acme_env == 'production')
         | ternary('https://acme-v02.api.letsencrypt.org/directory',
                   'https://acme-staging-v02.api.letsencrypt.org/directory') }}
    acme_version: 2
    cert_base_path: "/tmp/certs/{{ cert_acme_env }}"
    cert_sm_secret_prefix: "cert-automation"
    _distribute_jt_name: "Cert - Distribute Certificate"

  tasks:
    # ── Resolve ansible hostname to FQDN + IP via EC2 ───────────────────
    - name: Look up EC2 instance by Name tag
      amazon.aws.ec2_instance_info:
        filters:
          "tag:Name": "{{ cert_ansible_hostname }}"
          instance-state-name: running
      register: ec2_lookup

    - name: Validate instance was found
      ansible.builtin.assert:
        that:
          - ec2_lookup.instances | length > 0
        fail_msg: >-
          No running EC2 instance found with Name tag '{{ cert_ansible_hostname }}'.
          Verify the host exists and is running.

    - name: Set host facts from EC2 instance
      vars:
        _instance: "{{ ec2_lookup.instances[0] }}"
        _dns_name: "{{ cert_ansible_hostname | replace('_', '-') }}.{{ cert_route53_zone }}"
      ansible.builtin.set_fact:
        _ec2_instance: "{{ _instance }}"
        cert_target_ip: "{{ _instance.public_ip_address | default(_instance.private_ip_address) }}"
        cert_hostname: "{{ _instance.tags.FQDN | default(_dns_name) }}"

    - name: Set derived paths from resolved hostname
      ansible.builtin.set_fact:
        privatekey_path: "{{ cert_base_path }}/{{ cert_hostname }}.pem"
        fullchain_path: "{{ cert_base_path }}/fullchain.crt"
        chain_path: "{{ cert_base_path }}/intermediate.crt"
        account_key_path: "{{ cert_base_path }}/letsencrypt-{{ cert_acme_env }}.pem"
        csr_path: "{{ cert_base_path }}/{{ cert_hostname }}.csr"
        crt_path: "{{ cert_base_path }}/{{ cert_hostname }}.crt"
        cert_sm_secret_name: "{{ cert_sm_secret_prefix }}/certs/{{ cert_hostname }}/{{ cert_acme_env }}"

    - name: Display resolved host info
      ansible.builtin.debug:
        msg:
          - "Ansible hostname: {{ cert_ansible_hostname }}"
          - "Resolved FQDN:   {{ cert_hostname }}"
          - "Target IP:        {{ cert_target_ip }}"
          - "Instance ID:      {{ _ec2_instance.instance_id }}"
          - "SM secret path:   {{ cert_sm_secret_name }}"

    - name: Ensure A record exists for host in Route53
      amazon.aws.route53:
        zone: "{{ cert_route53_zone }}"
        record: "{{ cert_hostname }}"
        type: A
        ttl: 300
        state: present
        overwrite: true
        value:
          - "{{ cert_target_ip }}"
        wait: true

    # ── Issue the certificate ────────────────────────────────────────────
    - name: Ensure certificate directory exists
      ansible.builtin.file:
        path: "{{ cert_base_path }}"
        state: directory
        mode: "0700"

    - name: Generate ACME account private key
      community.crypto.openssl_privatekey:
        path: "{{ account_key_path }}"

    - name: Generate server private key
      community.crypto.openssl_privatekey:
        path: "{{ privatekey_path }}"

    - name: Generate Certificate Signing Request
      community.crypto.openssl_csr:
        path: "{{ csr_path }}"
        privatekey_path: "{{ privatekey_path }}"
        common_name: "{{ cert_hostname }}"

    - name: Request ACME challenge
      community.crypto.acme_certificate:
        terms_agreed: true
        acme_version: "{{ acme_version }}"
        account_key_src: "{{ account_key_path }}"
        account_email: "{{ cert_account_email }}"
        src: "{{ csr_path }}"
        cert: "{{ crt_path }}"
        challenge: dns-01
        acme_directory: "{{ acme_directory }}"
        remaining_days: 30
      register: acme_challenge

    - name: Create Route53 DNS-01 TXT record
      amazon.aws.route53:
        zone: "{{ cert_route53_zone }}"
        record: "{{ acme_challenge.challenge_data[cert_hostname]['dns-01'].record }}"
        type: TXT
        ttl: 60
        state: present
        wait: true
        overwrite: true
        value: >-
          "{{ acme_challenge.challenge_data[cert_hostname]['dns-01'].resource_value }}"
      when:
        - acme_challenge is changed
        - cert_hostname in acme_challenge.challenge_data

    - name: Validate challenge and retrieve certificate
      community.crypto.acme_certificate:
        terms_agreed: true
        acme_version: "{{ acme_version }}"
        account_key_src: "{{ account_key_path }}"
        account_email: "{{ cert_account_email }}"
        src: "{{ csr_path }}"
        cert: "{{ crt_path }}"
        fullchain: "{{ fullchain_path }}"
        chain: "{{ chain_path }}"
        challenge: dns-01
        acme_directory: "{{ acme_directory }}"
        remaining_days: 30
        data: "{{ acme_challenge }}"
      when: acme_challenge is changed

    - name: Clean up Route53 TXT record
      amazon.aws.route53:
        zone: "{{ cert_route53_zone }}"
        record: "{{ acme_challenge.challenge_data[cert_hostname]['dns-01'].record }}"
        type: TXT
        ttl: 60
        state: absent
        value: >-
          "{{ acme_challenge.challenge_data[cert_hostname]['dns-01'].resource_value }}"
      when:
        - cert_cleanup_dns_record | default(false) | bool
        - acme_challenge is changed
        - cert_hostname in acme_challenge.challenge_data

    - name: Display certificate paths
      ansible.builtin.debug:
        msg:
          - "Certificate:  {{ crt_path }}"
          - "Full chain:   {{ fullchain_path }}"
          - "Private key:  {{ privatekey_path }}"
          - "Chain:        {{ chain_path }}"
          - "DNS TXT record preserved: {{ not (cert_cleanup_dns_record | default(false) | bool) }}"

    # ── Store cert in AWS Secrets Manager ────────────────────────────────
    - name: Store certificate and key in Secrets Manager
      community.aws.secretsmanager_secret:
        name: "{{ cert_sm_secret_name }}"
        state: present
        secret_type: string
        secret: >-
          {{ {'fullchain': lookup('file', fullchain_path),
              'private_key': lookup('file', privatekey_path),
              'hostname': cert_hostname,
              'acme_env': cert_acme_env,
              'issued_by': cert_account_email,
              'ansible_hostname': cert_ansible_hostname} | to_json }}
        tags:
          hostname: "{{ cert_hostname }}"
          acme_env: "{{ cert_acme_env }}"
          ansible_hostname: "{{ cert_ansible_hostname }}"
          managed_by: cert-automation

    - name: Confirm cert stored in Secrets Manager
      ansible.builtin.debug:
        msg: "Certificate stored in SM: {{ cert_sm_secret_name }}"

    # ── Launch distribution ──────────────────────────────────────────────
    - name: Launch Distribute JT
      ansible.controller.job_launch:
        job_template: "{{ _distribute_jt_name }}"
        extra_vars:
          cert_target_hosts: "{{ cert_target_ip }}"
          cert_sm_secret_name: "{{ cert_sm_secret_name }}"
          cert_aws_region: "{{ cert_aws_region }}"
          cert_dest_path: "{{ cert_dest_path }}"
          cert_key_dest_path: "{{ cert_key_dest_path }}"
        wait: true
        timeout: 600
        controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
        controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        validate_certs: false
        request_timeout: 10
      register: _dist_job

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════"
          - "Certificate issued, stored in SM, and distributed"
          - "═══════════════════════════════════════════════════════"
          - "Ansible host:     {{ cert_ansible_hostname }}"
          - "Resolved FQDN:    {{ cert_hostname }}"
          - "Target IP:        {{ cert_target_ip }}"
          - "ACME env:         {{ cert_acme_env }}"
          - "SM secret:        {{ cert_sm_secret_name }}"
          - "Cert dest:        {{ cert_dest_path }}"
          - "Key dest:         {{ cert_key_dest_path }}"
          - "Distribute job:   {{ _dist_job.id | default('?') }}"
          - "Distribute status: {{ _dist_job.status | default('?') }}"
          - "DNS TXT cleanup:  {{ cert_cleanup_dns_record | default(false) | bool }}"
          - "═══════════════════════════════════════════════════════"
