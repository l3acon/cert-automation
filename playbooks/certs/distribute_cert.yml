---
- name: Build target host list from survey
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add survey target hosts to runtime inventory
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: cert_targets
        ansible_user: ec2-user
      loop: "{{ cert_target_hosts.split(',') | map('trim') | list }}"

    - name: Write certificate files from workflow artifacts
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - content: "{{ cert_fullchain_content }}"
          dest: "/tmp/certs/fullchain.crt"
          mode: "0644"
        - content: "{{ cert_privatekey_content }}"
          dest: "/tmp/certs/server.key"
          mode: "0600"
      loop_control:
        label: "{{ item.dest }}"

- name: Distribute certificate to target hosts
  hosts: cert_targets
  gather_facts: false
  become: true

  tasks:
    - name: Ensure destination directories exist
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ cert_dest_path }}"
        - "{{ cert_key_dest_path }}"

    - name: Copy fullchain certificate
      ansible.builtin.copy:
        src: "/tmp/certs/fullchain.crt"
        dest: "{{ cert_dest_path }}"
        mode: "0644"
      notify: reload_services

    - name: Copy private key
      ansible.builtin.copy:
        src: "/tmp/certs/server.key"
        dest: "{{ cert_key_dest_path }}"
        mode: "0600"
      notify: reload_services

    - name: Display deployed certificate info
      ansible.builtin.debug:
        msg:
          - "Certificate deployed to {{ inventory_hostname }}"
          - "  Fullchain: {{ cert_dest_path }}"
          - "  Private key: {{ cert_key_dest_path }}"

  handlers:
    - name: Reload web services
      listen: reload_services
      ansible.builtin.debug:
        msg: >-
          Certificate deployed. Add service-specific reload tasks here
          (e.g., nginx, httpd, automation-controller).
