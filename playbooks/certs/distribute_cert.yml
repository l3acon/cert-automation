---
- name: Distribute certificate to target hosts
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    cert_base_path: "/tmp/certs/{{ cert_acme_env }}"
    fullchain_path: "{{ cert_base_path }}/fullchain.crt"
    privatekey_path: "{{ cert_base_path }}/{{ cert_hostname }}.pem"
    target_host_list: "{{ cert_target_hosts.split(',') | map('trim') | list }}"

  tasks:
    - name: Add target hosts to runtime inventory
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: cert_targets
      loop: "{{ target_host_list }}"

- name: Deploy certificates to targets
  hosts: cert_targets
  gather_facts: false
  become: true

  vars:
    cert_base_path: "/tmp/certs/{{ cert_acme_env }}"
    fullchain_path: "{{ cert_base_path }}/fullchain.crt"
    privatekey_path: "{{ cert_base_path }}/{{ cert_hostname }}.pem"

  tasks:
    - name: Ensure destination directories exist
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ cert_dest_path }}"
        - "{{ cert_key_dest_path }}"

    - name: Copy fullchain certificate
      ansible.builtin.copy:
        src: "{{ fullchain_path }}"
        dest: "{{ cert_dest_path }}"
        mode: "0644"
      notify: reload_services

    - name: Copy private key
      ansible.builtin.copy:
        src: "{{ privatekey_path }}"
        dest: "{{ cert_key_dest_path }}"
        mode: "0600"
      notify: reload_services

  handlers:
    - name: Reload web services
      listen: reload_services
      ansible.builtin.debug:
        msg: >-
          Certificate deployed. Add service-specific reload tasks here
          (e.g., nginx, httpd, automation-controller).
