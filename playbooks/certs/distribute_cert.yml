---
# Distribute a certificate to target hosts.
# Cert and key are injected by the TLS Certificate credential as temp files.
# Env vars CERT_FULLCHAIN_FILE and CERT_PRIVATE_KEY_FILE hold the file paths.
- name: Build target host list
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add target hosts to runtime inventory
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: cert_targets
        ansible_user: ec2-user
      loop: "{{ cert_target_hosts.split(',') | map('trim') | list }}"

- name: Distribute certificate to target hosts
  hosts: cert_targets
  gather_facts: false
  become: true

  tasks:
    - name: Ensure destination directories exist
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ cert_dest_path }}"
        - "{{ cert_key_dest_path }}"

    - name: Copy fullchain certificate
      ansible.builtin.copy:
        src: "{{ lookup('env', 'CERT_FULLCHAIN_FILE') }}"
        dest: "{{ cert_dest_path }}"
        mode: "0644"

    - name: Copy private key
      ansible.builtin.copy:
        src: "{{ lookup('env', 'CERT_PRIVATE_KEY_FILE') }}"
        dest: "{{ cert_key_dest_path }}"
        mode: "0600"

    - name: Display deployed certificate info
      ansible.builtin.debug:
        msg:
          - "Certificate deployed to {{ inventory_hostname }}"
          - "  Fullchain: {{ cert_dest_path }}"
          - "  Private key: {{ cert_key_dest_path }}"

  handlers:
    - name: Reload web services
      listen: reload_services
      ansible.builtin.debug:
        msg: >-
          Certificate deployed. Add service-specific reload tasks here
          (e.g., nginx, httpd, automation-controller).
